<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  /* ===== EDIT THESE TWO THINGS =====
     1. Put your invitation card image next to this file and name it invitation-card.jpg
        (or change the filename below).
     2. Replace YOUR_FORM_ID in the <form action> further down with your Formspree form ID. */
  :root {
    --card-image: url("invitation-card.jpg");

    --ink: #14213d;
    --paper: #ffffff;
    --muted: #5b6475;
    --line: #d9dde5;
    --gold: #c9a24b;
    --error: #b3261e;
    --ok: #1f7a4d;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #0d1426;
    -webkit-font-smoothing: antialiased;
  }

  .scroll-progress {
    position: fixed;
    inset: 0 auto auto 0;
    z-index: 3;
    width: 100%;
    height: 3px;
    background: var(--gold);
    transform: scaleX(var(--scroll-progress, 0));
    transform-origin: left;
  }

  /* The card as full-bleed background: blurred and darkened */
  .backdrop {
    position: fixed; inset: 0; z-index: 0;
    background:
      linear-gradient(rgba(10,16,32,.62), rgba(10,16,32,.78)),
      var(--card-image) center / cover no-repeat,
      linear-gradient(135deg, #1b2a4d, #0d1426);
  }
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .page {
    position: relative; z-index: 1;
    min-height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    gap: clamp(24px, 5vw, 72px);
    align-items: center;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 56px);
    padding-top: max(clamp(20px, 4vw, 56px), env(safe-area-inset-top, 0px));
    padding-bottom: max(clamp(20px, 4vw, 56px), env(safe-area-inset-bottom, 0px));
  }

  /* The card shown sharp */
  .card-wrap { display: flex; justify-content: center; }
  .card {
    width: 100%;
    max-width: 560px;
    aspect-ratio: 4 / 5;
    max-height: 82vh;
    border-radius: 6px;
    background:
      var(--card-image) center / contain no-repeat,
      repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 14px, rgba(255,255,255,.02) 14px 28px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    outline: 1px solid rgba(255,255,255,.14);
    outline-offset: -1px;
  }

  .panel {
    background: var(--paper);
    border-radius: 14px;
    padding: clamp(22px, 3.2vw, 38px);
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }

  .motion-ready [data-reveal] {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .motion-ready [data-reveal].is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  .motion-ready .panel[data-reveal]:not(.is-visible) .field,
  .motion-ready .panel[data-reveal]:not(.is-visible) .submit {
    opacity: 0;
    transform: translateY(12px);
  }
  .motion-ready .panel[data-reveal].is-visible .field,
  .motion-ready .panel[data-reveal].is-visible .submit {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .45s ease, transform .45s ease;
  }
  .motion-ready .panel[data-reveal].is-visible .field:nth-of-type(1) { transition-delay: .08s; }
  .motion-ready .panel[data-reveal].is-visible .field:nth-of-type(2) { transition-delay: .16s; }
  .motion-ready .panel[data-reveal].is-visible .field:nth-of-type(3) { transition-delay: .24s; }
  .motion-ready .panel[data-reveal].is-visible .submit { transition-delay: .32s; }

  .panel h1 {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.75rem, 3.2vw, 2.4rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  .panel p.lead {
    margin: 0 0 26px;
    color: var(--muted);
    line-height: 1.55;
    max-width: 44ch;
  }

  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 7px; }
  input[type="text"], input[type="tel"], input[type="number"] {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 13px 14px;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus-visible {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 4px rgba(201,162,75,.4);
  }
  input[aria-invalid="true"] { border-color: var(--error); }

  .amount-box { position: relative; }
  .amount-box .naira {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-weight: 600; color: var(--muted); pointer-events: none;
  }
  .amount-box input { padding-left: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    font: inherit; font-size: .9rem; font-weight: 500;
    padding: 8px 14px;
    background: #fff; color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--ink); }
  .chip:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(201,162,75,.4); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .err { color: var(--error); font-size: .85rem; margin: 6px 0 0; min-height: 0; }
  .err:empty { display: none; }

  .submit {
    width: 100%;
    margin-top: 6px;
    font: inherit; font-weight: 600; font-size: 1.02rem;
    padding: 15px 18px;
    background: var(--ink); color: #fff;
    border: 0; border-radius: 8px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .submit:hover { background: #0c1630; }
  .submit:active { transform: translateY(1px); }
  .submit:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(201,162,75,.6); }
  .submit[disabled] { opacity: .65; cursor: progress; }

  .form-error {
    margin-top: 14px; padding: 12px 14px;
    background: #fdecea; color: var(--error);
    border-radius: 8px; font-size: .92rem; line-height: 1.45;
  }
  .form-error:empty { display: none; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .success { display: none; text-align: left; }
  .success .tick {
    width: 46px; height: 46px; border-radius: 50%;
    background: #e5f4ec; color: var(--ok);
    display: grid; place-items: center; margin-bottom: 16px;
  }
  .success h2 { font-family: "Newsreader", Georgia, serif; font-size: 1.7rem; margin: 0 0 8px; }
  .success p { margin: 0 0 20px; color: var(--muted); line-height: 1.55; }
  .success .again {
    font: inherit; font-weight: 600; color: var(--ink);
    background: none; border: 1.5px solid var(--line); border-radius: 8px;
    padding: 11px 16px; cursor: pointer;
  }
  .success .again:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(201,162,75,.4); }
  .panel.done form, .panel.done h1, .panel.done .lead { display: none; }
  .panel.done .success { display: block; }

  /* Mobile: card on top, form below */
  @media (max-width: 860px) {
    .page { grid-template-columns: 1fr; align-content: start; }
    .card { max-width: 420px; max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
    .scroll-progress { display: none; }
  }
  @media (prefers-color-scheme: dark) {
    /* page is already dark; the form panel stays light for legibility */
  }
</style>
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="page">
    <div class="card-wrap" data-reveal>
      <div class="card" role="img" aria-label="Invitation card"></div>
    </div>

    <section class="panel" id="panel" data-reveal>
      <h1>Be part of it</h1>
      <p class="lead">Enter your details and the amount you'd like to give. We'll be in touch on the number you provide.</p>

      <!-- Replace YOUR_FORM_ID with your Formspree form ID, e.g. https://formspree.io/f/xyzabcde -->
      <form id="donate" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
          <p class="err" id="name-err"></p>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="0803 000 0000" required>
          <p class="err" id="phone-err"></p>
        </div>

        <div class="field">
          <label for="amount">Donation amount</label>
          <div class="amount-box">
            <span class="naira" aria-hidden="true">₦</span>
            <input type="number" id="amount" name="amount" min="100" step="any" inputmode="numeric" placeholder="0" required>
          </div>
          <div class="chips" role="group" aria-label="Quick amounts">
            <button type="button" class="chip" data-amt="5000">₦5,000</button>
            <button type="button" class="chip" data-amt="10000">₦10,000</button>
            <button type="button" class="chip" data-amt="20000">₦20,000</button>
            <button type="button" class="chip" data-amt="50000">₦50,000</button>
          </div>
          <p class="err" id="amount-err"></p>
        </div>

        <input type="hidden" name="currency" value="NGN">
        <input type="hidden" name="_subject" value="New donation pledge">
        <div class="hp" aria-hidden="true"><label>Leave blank <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></div>

        <button type="submit" class="submit" id="submit">Submit my pledge</button>
        <div class="form-error" id="form-error" role="alert"></div>
      </form>

      <div class="success" id="success" role="status" aria-live="polite">
        <div class="tick" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h2>Thank you, <span id="thanks-name"></span></h2>
        <p>Your pledge of <strong id="thanks-amt"></strong> has been received. We'll contact you on <span id="thanks-phone"></span>.</p>
        <button type="button" class="again" id="again">Make another pledge</button>
      </div>
    </section>
  </main>

<script>
(function () {
  var form = document.getElementById('donate');
  var panel = document.getElementById('panel');
  var btn = document.getElementById('submit');
  var amount = document.getElementById('amount');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var formErr = document.getElementById('form-error');
  var reveals = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));
  var progressFrame = null;

  function updateScrollProgress() {
    progressFrame = null;
    var scrollable = document.documentElement.scrollHeight - window.innerHeight;
    var progress = scrollable > 0 ? window.scrollY / scrollable : 0;
    document.documentElement.style.setProperty('--scroll-progress', String(Math.min(1, Math.max(0, progress))));
  }

  function onScroll() {
    if (progressFrame === null) progressFrame = window.requestAnimationFrame(updateScrollProgress);
  }

  if ('IntersectionObserver' in window) {
    document.body.classList.add('motion-ready');
    var revealObserver = new IntersectionObserver(function (entries, observer) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -24px 0px' });

    reveals.forEach(function (element) { revealObserver.observe(element); });
  } else {
    reveals.forEach(function (element) { element.classList.add('is-visible'); });
  }

  updateScrollProgress();
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  function fmt(n) { return '\u20A6' + Number(n).toLocaleString('en-NG'); }

  function syncChips() {
    chips.forEach(function (c) {
      c.setAttribute('aria-pressed', String(Number(c.dataset.amt) === Number(amount.value)));
    });
  }
  chips.forEach(function (c) {
    c.setAttribute('aria-pressed', 'false');
    c.addEventListener('click', function () {
      amount.value = c.dataset.amt;
      setErr('amount', '');
      syncChips();
    });
  });
  amount.addEventListener('input', syncChips);

  function setErr(id, msg) {
    document.getElementById(id + '-err').textContent = msg;
    document.getElementById(id).setAttribute('aria-invalid', msg ? 'true' : 'false');
  }

  function validate() {
    var ok = true, first = null;
    var name = form.name.value.trim();
    var phone = form.phone.value.replace(/[\s\-()]/g, '');
    var amt = Number(amount.value);

    if (name.length < 2) { setErr('name', 'Enter your full name.'); ok = false; first = first || form.name; } else setErr('name', '');
    if (!/^(\+?234|0)[789][01]\d{8}$/.test(phone) && !/^\+?\d{10,15}$/.test(phone)) {
      setErr('phone', 'Enter a valid phone number, e.g. 0803 000 0000.'); ok = false; first = first || form.phone;
    } else setErr('phone', '');
    if (!amt || amt < 100) { setErr('amount', 'Enter an amount of \u20A6100 or more.'); ok = false; first = first || amount; } else setErr('amount', '');

    if (first) first.focus();
    return ok;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    formErr.textContent = '';
    if (!validate()) return;

    if (form.action.indexOf('YOUR_FORM_ID') !== -1) {
      formErr.textContent = 'This form is not connected yet. Replace YOUR_FORM_ID in the form action with your Formspree form ID.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending\u2026';

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    }).then(function (res) {
      if (res.ok) {
        document.getElementById('thanks-name').textContent = form.name.value.trim().split(' ')[0];
        document.getElementById('thanks-amt').textContent = fmt(amount.value);
        document.getElementById('thanks-phone').textContent = form.phone.value.trim();
        panel.classList.add('done');
        form.reset(); syncChips();
      } else {
        return res.json().then(function (d) {
          throw new Error(d && d.errors ? d.errors.map(function (x) { return x.message; }).join(', ') : 'Submission failed.');
        });
      }
    }).catch(function (err) {
      formErr.textContent = (err && err.message ? err.message + ' ' : '') + 'Check your connection and try again.';
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = 'Submit my pledge';
    });
  });

  document.getElementById('again').addEventListener('click', function () {
    panel.classList.remove('done');
    form.name.focus();
  });
})();
</script>
</body>
</html>
